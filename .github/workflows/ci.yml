name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cogkura_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COGKURA_POSTGRES_MEMORY_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cogkura_bench

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked --python ${{ matrix.python-version }} --managed-python

      - name: Report SQLite version
        run: uv run python -c "import sqlite3; print(sqlite3.sqlite_version)"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

      - name: Validate mini dataset
        run: uv run cogkura-bench validate-dataset mini

      - name: Run mini benchmark (oracle)
        run: uv run cogkura-bench run --dataset mini --backend oracle --quiet

      - name: Run mini benchmark (token-overlap)
        run: uv run cogkura-bench run --dataset mini --backend token-overlap --quiet

      - name: Validate software_project_v1 dataset
        run: uv run cogkura-bench validate-dataset software_project_v1

      - name: Run Atlas benchmark (oracle)
        run: uv run cogkura-bench run --dataset software_project_v1 --backend oracle --quiet

      - name: Validate helios_v1 dataset
        run: uv run cogkura-bench validate-dataset helios_v1

      - name: Run Helios benchmark (oracle)
        run: uv run cogkura-bench run --dataset helios_v1 --backend oracle --quiet

      - name: Validate customer_decision_context_v1 dataset
        run: uv run cogkura-bench validate-dataset customer_decision_context_v1

      - name: Run customer decision context benchmark (oracle)
        run: uv run cogkura-bench run --dataset customer_decision_context_v1 --backend oracle --quiet

      - name: Run mini benchmark (cogkura)
        run: uv run cogkura-bench run --dataset mini --backend cogkura --quiet

      - name: Validate interference_v1 dataset
        run: uv run cogkura-bench validate-dataset interference_v1

      - name: Run interference benchmark (oracle)
        run: uv run cogkura-bench run --dataset interference_v1 --backend oracle --quiet

      - name: Run interference benchmark (cogkura)
        run: uv run cogkura-bench run --dataset interference_v1 --backend cogkura --quiet

      - name: Validate transient_interference_v1 dataset
        run: uv run cogkura-bench validate-dataset transient_interference_v1

      - name: Run transient interference benchmark (oracle)
        run: uv run cogkura-bench run --dataset transient_interference_v1 --backend oracle --quiet

      - name: Run transient interference benchmark (cogkura)
        run: uv run cogkura-bench run --dataset transient_interference_v1 --backend cogkura --quiet

      - name: Run transient interference benchmark (cogkura-interference)
        run: uv run cogkura-bench run --dataset transient_interference_v1 --backend cogkura-interference --quiet

      - name: Validate transient_interference_v2 dataset
        run: uv run cogkura-bench validate-dataset transient_interference_v2

      - name: Run transient interference v2 benchmark (oracle)
        run: uv run cogkura-bench run --dataset transient_interference_v2 --backend oracle --quiet

      - name: Run transient interference v2 benchmark (cogkura)
        run: uv run cogkura-bench run --dataset transient_interference_v2 --backend cogkura --quiet

      - name: Run transient interference v2 benchmark (cogkura-interference)
        run: uv run cogkura-bench run --dataset transient_interference_v2 --backend cogkura-interference --quiet

      - name: Validate persistent_inhibition_v1 dataset
        run: uv run cogkura-bench validate-dataset persistent_inhibition_v1

      - name: Run persistent inhibition benchmark (oracle)
        run: uv run cogkura-bench run --dataset persistent_inhibition_v1 --backend oracle --quiet

      - name: Run persistent inhibition benchmark (cogkura)
        run: uv run cogkura-bench run --dataset persistent_inhibition_v1 --backend cogkura --quiet

      - name: Run persistent inhibition benchmark (cogkura-inhibition-recording)
        run: uv run cogkura-bench run --dataset persistent_inhibition_v1 --backend cogkura-inhibition-recording --quiet

      - name: Run persistent inhibition benchmark (cogkura-inhibition)
        run: uv run cogkura-bench run --dataset persistent_inhibition_v1 --backend cogkura-inhibition --quiet

      - name: Validate persistent_inhibition_software_v1 dataset
        run: uv run cogkura-bench validate-dataset persistent_inhibition_software_v1

      - name: Run software inhibition workload (oracle)
        run: uv run cogkura-bench run --dataset persistent_inhibition_software_v1 --backend oracle --quiet

      - name: Run software inhibition workload (cogkura)
        run: uv run cogkura-bench run --dataset persistent_inhibition_software_v1 --backend cogkura --quiet

      - name: Run software inhibition workload (cogkura-inhibition-recording)
        run: uv run cogkura-bench run --dataset persistent_inhibition_software_v1 --backend cogkura-inhibition-recording --quiet

      - name: Run software inhibition workload (cogkura-inhibition)
        run: uv run cogkura-bench run --dataset persistent_inhibition_software_v1 --backend cogkura-inhibition --quiet

      - name: Validate persistent_inhibition_customer_v1 dataset
        run: uv run cogkura-bench validate-dataset persistent_inhibition_customer_v1

      - name: Run customer inhibition workload (oracle)
        run: uv run cogkura-bench run --dataset persistent_inhibition_customer_v1 --backend oracle --quiet

      - name: Run customer inhibition workload (cogkura)
        run: uv run cogkura-bench run --dataset persistent_inhibition_customer_v1 --backend cogkura --quiet

      - name: Run customer inhibition workload (cogkura-inhibition-recording)
        run: uv run cogkura-bench run --dataset persistent_inhibition_customer_v1 --backend cogkura-inhibition-recording --quiet

      - name: Run customer inhibition workload (cogkura-inhibition)
        run: uv run cogkura-bench run --dataset persistent_inhibition_customer_v1 --backend cogkura-inhibition --quiet

      - name: Validate source_authority_v1 dataset
        run: uv run cogkura-bench validate-dataset source_authority_v1

      - name: Run source authority benchmark (oracle)
        run: uv run cogkura-bench run --dataset source_authority_v1 --backend oracle --quiet

      - name: Run source authority benchmark (cogkura-authority-control)
        run: uv run cogkura-bench run --dataset source_authority_v1 --backend cogkura-authority-control --quiet

      - name: Run source authority benchmark (cogkura-authority)
        run: uv run cogkura-bench run --dataset source_authority_v1 --backend cogkura-authority --quiet

      - name: Validate authoritative_corrections_v1 dataset
        run: uv run cogkura-bench validate-dataset authoritative_corrections_v1

      - name: Run authoritative corrections benchmark (oracle)
        run: uv run cogkura-bench run --dataset authoritative_corrections_v1 --backend oracle --quiet

      - name: Run authoritative corrections benchmark (cogkura-correction-control)
        run: uv run cogkura-bench run --dataset authoritative_corrections_v1 --backend cogkura-correction-control --quiet

      - name: Run authoritative corrections benchmark (cogkura-correction)
        run: uv run cogkura-bench run --dataset authoritative_corrections_v1 --backend cogkura-correction --quiet

      - name: Validate source-aware metamemory dataset
        run: uv run cogkura-bench validate-dataset source_aware_metamemory_v1

      - name: Run source-aware metamemory benchmark (oracle N/A)
        run: uv run cogkura-bench run --dataset source_aware_metamemory_v1 --backend oracle --quiet

      - name: Run source-aware metamemory benchmark (diagnostics off)
        run: uv run cogkura-bench run --dataset source_aware_metamemory_v1 --backend cogkura-source-control --quiet

      - name: Run source-aware metamemory benchmark (diagnostics on)
        run: uv run cogkura-bench run --dataset source_aware_metamemory_v1 --backend cogkura-source --quiet

      - name: Validate frozen public Core release
        if: matrix.python-version != '3.11'
        env:
          PYTHONHASHSEED: "0"
        run: >-
          uv run python scripts/run_source_metamemory_validation.py
          --diagnostics-parity --postgres
          --approved-corrections tests/reviewed_corrections/cogkura_0195_13ad733.json
          --details-output results/embedded-frozen-details.json
          --output results/embedded-frozen-validation.json

      - name: Compare Python 3.11 with historical Core
        if: matrix.python-version == '3.11'
        env:
          PYTHONHASHSEED: "0"
        run: |
          status=0
          uv run python scripts/run_source_metamemory_validation.py \
            --diagnostics-parity --postgres \
            --approved-corrections tests/reviewed_corrections/cogkura_0195_13ad733.json \
            --details-output results/embedded-frozen-details.json \
            --output results/embedded-frozen-python311-raw.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          if [ "$status" -eq 1 ]; then echo '::warning::Python 3.11 frozen differences remain unapproved; see raw artifact'; fi
          uv run python scripts/compare_python311_history.py \
            --historical docs/findings/data/embedded-core-0.18.4-frozen-311-historical.json \
            --candidate results/embedded-frozen-python311-raw.json \
            --public-release --output results/embedded-frozen-python311-paired.json

      - name: Create isolated backend comparison database
        if: ${{ !cancelled() }}
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres cogkura_bench_threeway

      - name: Compare embedded storage backends
        if: ${{ !cancelled() }}
        env:
          PYTHONHASHSEED: "0"
        run: |
          status=0
          uv run python scripts/run_embedded_freeze_validation.py \
            --postgres-url "postgresql+asyncpg://postgres:postgres@localhost:5432/cogkura_bench_threeway" --verify-postgres-repeat --details \
            --output results/embedded-threeway-raw.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          uv run python scripts/review_embedded_freeze.py \
            --report results/embedded-threeway-raw.json \
            --approval tests/reviewed_corrections/order_0195_13ad733.json \
            --output results/embedded-threeway-reviewed.json

      - name: Preserve benchmark validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-validation-python-${{ matrix.python-version }}
          path: |
            results/embedded-frozen-details.json
            results/embedded-frozen-validation.json
            results/embedded-frozen-python311-raw.json
            results/embedded-frozen-python311-paired.json
            results/embedded-threeway-raw.json
            results/embedded-threeway-reviewed.json
          if-no-files-found: warn

  linux-historical-diagnostics:
    name: Linux same-environment historical diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Bench with public Core 0.19.5
        run: uv sync --all-extras --dev --locked --python 3.12 --managed-python
      - name: Capture public Core signatures
        env:
          PYTHONHASHSEED: "0"
        run: |
          status=0
          .venv/bin/python scripts/run_source_metamemory_validation.py \
            --details-output results/linux-release-details.json \
            --output results/linux-release-frozen.json || status=$?
          if [ "$status" -gt 1 ] || [ ! -s results/linux-release-details.json ]; then exit 1; fi
      - name: Install historical Core in the same environment
        run: >-
          uv pip install --python .venv/bin/python --no-deps
          'git+https://github.com/cogkura/cogkura.git@93cb7f6a6daae30333008600f3556e6af4f99b3d'
      - name: Capture historical Core signatures
        env:
          PYTHONHASHSEED: "0"
        run: |
          status=0
          .venv/bin/python scripts/run_source_metamemory_validation.py \
            --details-output results/linux-historical-details.json \
            --output results/linux-historical-frozen.json || status=$?
          if [ "$status" -gt 1 ] || [ ! -s results/linux-historical-details.json ]; then exit 1; fi
      - name: Preserve unreviewed diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-historical-comparison
          path: |
            results/linux-release-details.json
            results/linux-release-frozen.json
            results/linux-historical-details.json
            results/linux-historical-frozen.json
          if-no-files-found: warn
